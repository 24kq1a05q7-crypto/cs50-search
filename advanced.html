<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Advanced Search</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

```
<nav>
    <a href="index.html">Google Search</a>
</nav>

<header class="advanced-header">

    <div class="small-logo">
        <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
    </div>

</header>

<div class="advanced-title">
    Advanced Search
</div>

<div class="line"></div>

<main class="advanced-container">

    <h2>Find pages with...</h2>

    <form action="https://www.google.com/search">

        <div class="advanced-row">

            <label for="all-words">
                all these words:
            </label>

            <input
                id="all-words"
                type="text"
                name="as_q"
            >

        </div>

        <div class="advanced-row">

            <label for="exact-phrase">
                this exact word or phrase:
            </label>

            <input
                id="exact-phrase"
                type="text"
                name="as_epq"
            >

        </div>

        <div class="advanced-row">

            <label for="any-words">
                any of these words:
            </label>

            <input
                id="any-words"
                type="text"
                name="as_oq"
            >

        </div>

        <div class="advanced-row">

            <label for="none-words">
                none of these words:
            </label>

            <input
                id="none-words"
                type="text"
                name="as_eq"
            >

        </div>

        <div class="advanced-button-row">

            <input
                class="advanced-button"
                type="submit"
                value="Advanced Search"
            >

        </div>

    </form>

</main>
```

</body>
</html>
