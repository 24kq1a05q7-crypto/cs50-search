<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Image Search</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="main-page">


<nav>
    <a href="index.html">Google Search</a>
</nav>

<main class="search-container">

    <h1 class="google-logo">
        <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
    </h1>

    <p class="image-text">Image Search</p>

    <form action="https://www.google.com/search">

        <!-- tbm=isch tells Google to search for images -->
        <input type="hidden" name="tbm" value="isch">

        <input
            class="search-bar"
            type="text"
            name="q"
            autocomplete="off"
            autofocus
        >

        <div class="button-container">

            <input
                class="search-button"
                type="submit"
                value="Google Image Search"
            >

        </div>

    </form>

</main>


</body>
</html>
